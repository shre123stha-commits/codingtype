    <!-- Structured data: the app itself -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "CodeType",
        "url": "https://codetype-eight.vercel.app/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Requires JavaScript",
        "description": "Tactical typing telemetry for software developers. Type real production code with live WPM, accuracy and per-key symbol telemetry. Includes blind training modes and 1v1 ghost races.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "publisher": { "@type": "Organization", "name": "CodeType", "url": "https://codetype-eight.vercel.app/" },
        "about": "Typing practice, developer coding speed, keyboard muscle memory",
        "keywords": "typing trainer, code typing, developer typing practice, blind typing, WPM"
      }
    </script>

    <!-- Structured data: FAQ (kept in sync with frontend/src/pages/FaqPage.jsx) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is CodeType?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A typing trainer built for software developers. You type real production code — Express routers, React components, SQL, Rust — instead of random dictionary words, and get WPM, accuracy and per-key telemetry for the symbols you actually use every day."
            }
          },
          {
            "@type": "Question",
            "name": "How is it different from Monkeytype or TypingClub?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Those train general words from lorem ipsum. CodeType trains development syntax: braces, quotes, arrows, semicolons. Its blind modes hide characters ahead of your caret, which builds chunk-level muscle memory for code patterns instead of letter-by-letter reading."
            }
          },
          {
            "@type": "Question",
            "name": "What does BLIND 3CH actually train?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Blind mode hides the text and reveals only the few characters right in front of your caret. 3CH shows three characters ahead, so your brain stops reading one glyph at a time and starts recognizing symbol patterns — the way experienced developers read code on a dark terminal."
            }
          },
          {
            "@type": "Question",
            "name": "Where is my typing data stored?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "By default everything stays in your browser (localStorage) — nothing is uploaded. If you create an account with email + password, your sessions, personal bests and profile sync to your own Supabase cloud account. Those rows are protected by row-level security, so only you can read them."
            }
          },
          {
            "@type": "Question",
            "name": "Is CodeType free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — free, with no paywall. The site is supported by the unobtrusive ad banners you may see. The waitlist is only for early access to new features; it is never a paywall announcement."
            }
          }
        ]
      }
    </script>
  </head>

    <div id="root"></div>

  </body>
